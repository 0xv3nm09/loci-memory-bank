<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loci — your immersive memory palace</title><meta name="description" content="Capture scattered thoughts, find their connections, and remember what matters in Loci's immersive memory palace."><meta property="og:title" content="Loci — your immersive memory palace"><meta property="og:description" content="A calm space to capture, organize and recall your thoughts."><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="data:,"></head>
<body>
<div id="loci-splash"><div class="splash-title">Loci</div><div class="splash-sub">Making room for your thoughts…</div></div>
<div id="scene-container"></div>
<header class="loci-header"><div class="brand"><span class="brand-symbol">✧</span><div>Loci<small>YOUR MEMORY PALACE</small></div></div><div class="header-tools"><button id="webcam-toggle" title="Use webcam hand tracking">Hands</button><button id="sound-toggle" aria-pressed="false">Sound on</button><button id="text-toggle" aria-label="Change text size">Aa 100%</button><button id="xr-entry">Enter VR ↗</button></div></header>
<nav class="mode-switch" aria-label="Palace mode"><button data-palace-mode="think">◇ Think</button><button data-palace-mode="grow">+ Grow</button><button data-palace-mode="imagine">✧ Imagine</button></nav>
<div class="loci-bottom"><div id="hud-status" role="status"></div><div id="palace-health"><span id="health-notes">0 thoughts</span><span class="health-sep"></span><span id="health-due">0 due</span></div><div id="loci-hud"><input id="note-input" aria-label="Capture a thought" placeholder="What's on your mind?" maxlength="140" autocomplete="off"><button id="voice-btn" title="Speak a thought" aria-label="Voice capture">◉</button><button id="add-btn" aria-label="Add thought">＋ Add</button><button id="organize-btn" aria-label="Organize thoughts">✧ Organize</button><button id="recall-btn" aria-label="Start recall quiz">◈ Recall</button><button id="rewind-btn" aria-label="Rewind timeline">↶ Rewind</button><button id="help-btn" aria-label="Help">?</button></div></div>
<div id="loci-help" aria-hidden="true"><section class="help-card" tabindex="-1" role="dialog" aria-modal="true" aria-label="Your palace"><h1 class="help-title">Your palace</h1><p class="help-subtitle">A little space to think.</p><ol class="help-list" id="help-list"></ol><div class="help-divider"></div><div class="help-data-title">YOUR THOUGHTS</div><div class="help-data" id="help-data"><button id="data-export-btn">↓ Export palace</button><button id="replay-intro">↻ Opening story</button><button id="data-clear-btn" class="danger">Clear palace</button></div><button id="help-close">Back to palace</button></section></div>
<script type="module" src="/src/index.ts"></script>
</body></html>
