<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Loci — spatial memory bank</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --loci-bg: #060a16;
        --loci-glass: rgba(8, 12, 24, 0.88);
        --loci-glass-border: rgba(100, 140, 240, 0.18);
        --loci-ink: #eef1ff;
        --loci-ink-dim: rgba(160, 178, 230, 0.9);
        --loci-ink-muted: rgba(160, 178, 230, 0.5);
        --loci-accent: #46c8e8;
        --loci-primary-from: #7ee7d2;
        --loci-primary-to: #3dbfa3;
        --loci-voice-from: #ff8888;
        --loci-voice-to: #d04848;
        --loci-organize-from: #9fe8d8;
        --loci-organize-to: #3dbfa3;
        --loci-recall-from: #cfc2ff;
        --loci-recall-to: #7a5fd0;
        --loci-rewind-from: #82b4ff;
        --loci-rewind-to: #4a6fd0;
        --loci-danger-from: #ff9999;
        --loci-danger-to: #cc4444;
        --loci-radius: 12px;
        --loci-radius-lg: 18px;
      }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        background: var(--loci-bg);
      }

      /* ── Status bar ── */
      #hud-status {
        position: fixed;
        left: 50%;
        bottom: 86px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: var(--loci-ink-dim);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        z-index: 10;
        pointer-events: none;
        white-space: nowrap;
        transition: opacity 0.4s ease;
      }

      /* ── HUD bar ── */
      #loci-hud {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        background: var(--loci-glass);
        border: 1px solid var(--loci-glass-border);
        border-radius: var(--loci-radius-lg);
        backdrop-filter: blur(18px) saturate(1.3);
        -webkit-backdrop-filter: blur(18px) saturate(1.3);
        box-shadow:
          0 4px 28px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(80, 120, 220, 0.08) inset,
          0 1px 0 rgba(255, 255, 255, 0.03) inset;
        z-index: 10;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      /* ── Input ── */
      #loci-hud input {
        width: min(280px, 48vw);
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 400;
        color: var(--loci-ink);
        background: rgba(16, 22, 42, 0.85);
        border: 1px solid rgba(100, 140, 240, 0.22);
        border-radius: 10px;
        outline: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }
      #loci-hud input::placeholder {
        color: var(--loci-ink-muted);
      }
      #loci-hud input:focus {
        border-color: rgba(70, 200, 232, 0.6);
        box-shadow: 0 0 0 3px rgba(70, 200, 232, 0.12);
      }

      /* ── Buttons: base ── */
      #loci-hud button {
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #06131c;
        background: linear-gradient(180deg, var(--loci-primary-from) 0%, var(--loci-primary-to) 100%);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease;
        white-space: nowrap;
        position: relative;
        overflow: hidden;
      }
      /* Glass sheen overlay */
      #loci-hud button::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 50%);
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #loci-hud button:hover::after {
        opacity: 0.7;
      }
      #loci-hud button:hover {
        filter: brightness(1.14);
        box-shadow: 0 2px 16px rgba(70, 200, 232, 0.25);
        transform: translateY(-1px);
      }
      #loci-hud button:active {
        filter: brightness(0.92);
        transform: scale(0.96) translateY(0);
        transition-duration: 0.05s;
      }
      #loci-hud button:focus-visible {
        outline: 2px solid rgba(70, 200, 232, 0.7);
        outline-offset: 2px;
      }

      /* ── Secondary buttons ── */
      #loci-hud button.secondary {
        color: #c3d4f5;
        background: rgba(32, 44, 82, 0.85);
        border: 1px solid rgba(100, 140, 240, 0.2);
      }
      #loci-hud button.secondary::after {
        background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 50%);
      }
      #loci-hud button.secondary:hover {
        border-color: rgba(100, 140, 240, 0.4);
        box-shadow: 0 2px 14px rgba(70, 100, 220, 0.18);
        transform: translateY(-1px);
      }

      /* ── Per-button identity gradients ── */
      #organize-btn {
        background: linear-gradient(180deg, var(--loci-organize-from) 0%, var(--loci-organize-to) 100%) !important;
        color: #06131c !important;
        border: none !important;
      }
      #organize-btn:hover {
        box-shadow: 0 2px 18px rgba(95, 230, 200, 0.3) !important;
      }
      #recall-btn {
        background: linear-gradient(180deg, var(--loci-recall-from) 0%, var(--loci-recall-to) 100%) !important;
        color: #0e0a1f !important;
        border: none !important;
      }
      #recall-btn:hover {
        box-shadow: 0 2px 18px rgba(160, 140, 255, 0.3) !important;
      }
      #rewind-btn {
        background: linear-gradient(180deg, var(--loci-rewind-from) 0%, var(--loci-rewind-to) 100%) !important;
        color: #0a1025 !important;
        border: none !important;
      }
      #rewind-btn:hover {
        box-shadow: 0 2px 18px rgba(100, 160, 255, 0.3) !important;
      }

      /* ── Voice button states ── */
      #voice-btn {
        min-width: 40px;
        padding: 9px 10px;
        font-size: 16px;
        line-height: 1;
      }
      #voice-btn.active {
        background: linear-gradient(180deg, var(--loci-voice-from), var(--loci-voice-to)) !important;
        color: #fff !important;
        animation: loci-pulse 1.4s ease-in-out infinite;
        box-shadow: 0 0 18px rgba(220, 80, 80, 0.4);
      }
      @keyframes loci-pulse {
        0%, 100% { filter: brightness(1); box-shadow: 0 0 14px rgba(220,80,80,0.3); }
        50% { filter: brightness(1.2); box-shadow: 0 0 24px rgba(220,80,80,0.55); }
      }

      /* ── Help button ── */
      #help-btn {
        min-width: 36px;
        padding: 9px 0;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
      }

      /* ── Shimmer animation on add button ── */
      @keyframes loci-shimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      #add-btn {
        background-size: 200% auto;
        background-image: linear-gradient(
          90deg,
          var(--loci-primary-to) 0%,
          var(--loci-primary-from) 25%,
          #b0f8e8 50%,
          var(--loci-primary-from) 75%,
          var(--loci-primary-to) 100%
        );
      }
      #add-btn:hover {
        animation: loci-shimmer 2s linear infinite;
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ── Mobile responsive ── */
      @media (max-width: 640px) {
        #loci-hud {
          gap: 4px;
          padding: 6px 8px;
          border-radius: var(--loci-radius);
        }
        #loci-hud input {
          width: min(200px, 40vw);
          padding: 8px 10px;
          font-size: 13px;
        }
        #loci-hud button {
          padding: 8px 10px;
          font-size: 12px;
        }
      }

      /* ── Help overlay ── */
      #loci-help {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(4, 6, 14, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s;
      }
      #loci-help.visible {
        opacity: 1;
        visibility: visible;
      }
      #loci-help .help-card {
        max-width: 500px;
        width: calc(100% - 32px);
        padding: 28px 32px;
        background: linear-gradient(180deg, rgba(16,22,44,0.98) 0%, rgba(10,14,30,0.98) 100%);
        border: 1px solid rgba(120, 160, 255, 0.2);
        border-radius: 22px;
        color: #dfe6ff;
        box-shadow:
          0 8px 48px rgba(0,0,0,0.65),
          0 0 0 1px rgba(80,120,220,0.06) inset,
          0 1px 0 rgba(255,255,255,0.04) inset;
        transform: translateY(16px) scale(0.96);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        max-height: calc(100vh - 80px);
        overflow-y: auto;
      }
      #loci-help.visible .help-card {
        transform: translateY(0) scale(1);
      }
      #loci-help .help-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 4px;
        background: linear-gradient(135deg, #eef1ff, #9fb0d8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #loci-help .help-subtitle {
        font-size: 13px;
        color: #8fa3d8;
        margin-bottom: 16px;
      }
      #loci-help .help-list {
        font-size: 14px;
        line-height: 1.7;
        padding-left: 18px;
        color: #b9c5e2;
      }
      #loci-help .help-list li {
        margin-bottom: 4px;
      }
      #loci-help .help-list b {
        color: #eef1ff;
        font-weight: 600;
      }
      #loci-help .help-divider {
        margin: 18px 0 12px;
        border: none;
        border-top: 1px solid rgba(120, 160, 255, 0.12);
      }
      #loci-help .help-data-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7888b8;
        margin-bottom: 10px;
      }
      #loci-help .help-data {
        display: flex;
        gap: 8px;
      }
      #loci-help button {
        margin-top: 18px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #06131c;
        background: linear-gradient(180deg, var(--loci-primary-from) 0%, var(--loci-primary-to) 100%);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      #loci-help button:hover {
        filter: brightness(1.1);
      }
      #loci-help button:active {
        filter: brightness(0.92);
        transform: scale(0.97);
      }
      #loci-help .help-data button {
        margin-top: 0;
        padding: 8px 14px;
        font-size: 13px;
        color: #b9c5e2;
        background: rgba(32, 44, 82, 0.85);
        border: 1px solid rgba(100, 140, 240, 0.2);
        border-radius: 8px;
      }
      #loci-help .help-data button:hover {
        border-color: rgba(100, 140, 240, 0.4);
      }
      #loci-help .help-data button.danger {
        color: #ffb0b0;
        border-color: rgba(255, 120, 120, 0.3);
      }
      #loci-help .help-data button.danger:hover {
        border-color: rgba(255, 120, 120, 0.55);
        background: rgba(80, 30, 30, 0.5);
      }
      /* ── Splash / loading screen ── */
      #loci-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--loci-bg);
        transition: opacity 0.8s ease, visibility 0.8s;
      }
      #loci-splash.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-orb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #7ee7d2 0%, #3dbfa3 60%, #1a6b58 100%);
        box-shadow: 0 0 40px rgba(70,200,200,0.35), 0 0 80px rgba(70,200,200,0.15);
        animation: splash-breathe 2s ease-in-out infinite;
        margin-bottom: 24px;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(70,200,200,0.35), 0 0 80px rgba(70,200,200,0.15); }
        50% { transform: scale(1.12); box-shadow: 0 0 56px rgba(70,200,200,0.5), 0 0 100px rgba(70,200,200,0.2); }
      }
      .splash-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: linear-gradient(135deg, #eef1ff 0%, #7ee7d2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
      }
      .splash-sub {
        font-size: 13px;
        color: var(--loci-ink-muted);
        letter-spacing: 0.04em;
      }

      /* ── Onboarding coach marks ── */
      #loci-onboard {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(4, 6, 14, 0.82);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #loci-onboard.visible { opacity: 1; visibility: visible; }
      .onboard-card {
        max-width: 420px;
        width: calc(100% - 32px);
        padding: 28px 28px 22px;
        background: linear-gradient(180deg, rgba(16,22,44,0.98) 0%, rgba(10,14,30,0.98) 100%);
        border: 1px solid rgba(120, 160, 255, 0.2);
        border-radius: 22px;
        color: #dfe6ff;
        box-shadow: 0 8px 48px rgba(0,0,0,0.65);
        text-align: center;
        transform: translateY(16px) scale(0.96);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #loci-onboard.visible .onboard-card { transform: translateY(0) scale(1); }
      .onboard-step-num {
        font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--loci-accent); margin-bottom: 6px;
      }
      .onboard-title {
        font-size: 20px; font-weight: 700; margin-bottom: 8px;
        background: linear-gradient(135deg, #eef1ff, #9fb0d8);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      }
      .onboard-desc { font-size: 14px; line-height: 1.6; color: #b9c5e2; margin-bottom: 20px; }
      .onboard-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
      .onboard-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(100,140,240,0.25); transition: background 0.3s ease, transform 0.3s ease;
      }
      .onboard-dot.active { background: var(--loci-accent); transform: scale(1.25); }
      .onboard-dot.done { background: rgba(70,200,200,0.5); }
      .onboard-btn {
        padding: 11px 28px; font-size: 14px; font-weight: 600; color: #06131c;
        background: linear-gradient(180deg, var(--loci-primary-from), var(--loci-primary-to));
        border: none; border-radius: 10px; cursor: pointer;
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      .onboard-btn:hover { filter: brightness(1.1); }
      .onboard-btn:active { filter: brightness(0.92); transform: scale(0.97); }
      .onboard-skip {
        display: block; margin: 10px auto 0; padding: 6px 12px;
        font-size: 12px; color: var(--loci-ink-muted);
        background: none; border: none; cursor: pointer; transition: color 0.2s ease;
      }
      .onboard-skip:hover { color: var(--loci-ink-dim); }

      /* ── Palace health pill ── */
      #palace-health {
        position: fixed;
        left: 50%;
        bottom: 74px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 14px;
        background: rgba(8, 12, 24, 0.75);
        border: 1px solid rgba(100, 140, 240, 0.12);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.03em;
        color: var(--loci-ink-dim);
        z-index: 9;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #palace-health.visible { opacity: 1; }
      .health-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
      .health-dot.green { background: #43d9a3; box-shadow: 0 0 6px rgba(67,217,163,0.4); }
      .health-dot.amber { background: #f0b24f; box-shadow: 0 0 6px rgba(240,178,79,0.4); }
      .health-dot.blue  { background: #82b4ff; box-shadow: 0 0 6px rgba(130,180,255,0.4); }
      .health-sep { width: 1px; height: 14px; background: rgba(100,140,240,0.15); }
      .health-val.green { color: #43d9a3; }
      .health-val.amber { color: #f0b24f; }
    </style>
  </head>
  <body style="margin: 0">
    <!-- Splash screen — visible until IWSDK boots -->
    <div id="loci-splash">
      <div class="splash-orb"></div>
      <div class="splash-title">Loci</div>
      <div class="splash-sub">Entering your memory palace…</div>
    </div>

    <div id="scene-container"></div>
    <div id="hud-status"></div>

    <!-- Palace health pill -->
    <div id="palace-health">
      <span class="health-dot blue"></span>
      <span id="health-notes">0 thoughts</span>
      <span class="health-sep"></span>
      <span class="health-dot amber"></span>
      <span id="health-due">0 due</span>
    </div>

    <div id="loci-hud">
      <input
        id="note-input"
        placeholder="What's on your mind?"
        maxlength="140"
        autocomplete="off"
        aria-label="Capture a thought"
      />
      <button id="voice-btn" title="Speak a thought" aria-label="Voice capture">&#127908;</button>
      <button id="add-btn" aria-label="Add thought">Add</button>
      <button id="organize-btn" aria-label="Organize thoughts">Organize</button>
      <button id="recall-btn" aria-label="Start recall quiz">Recall</button>
      <button id="rewind-btn" aria-label="Rewind timeline">Rewind</button>
      <button id="help-btn" title="How Loci works" class="secondary" aria-label="Help">?</button>
    </div>
    <!-- Onboarding walkthrough — first launch only -->
    <div id="loci-onboard">
      <div class="onboard-card">
        <div class="onboard-step-num" id="onboard-step-label">Step 1 of 3</div>
        <div class="onboard-title" id="onboard-title">Capture a thought</div>
        <div class="onboard-desc" id="onboard-desc">Type anything in the box below and press <b>Add</b> — or hold the mic button to speak. Each thought becomes a floating card in your palace.</div>
        <div class="onboard-dots">
          <div class="onboard-dot active" data-step="0"></div>
          <div class="onboard-dot" data-step="1"></div>
          <div class="onboard-dot" data-step="2"></div>
        </div>
        <button class="onboard-btn" id="onboard-next">Next</button>
        <button class="onboard-skip" id="onboard-skip">Skip intro</button>
      </div>
    </div>

    <div id="loci-help">
      <div class="help-card">
        <div class="help-title">How Loci works</div>
        <div class="help-subtitle">Your spatial memory bank</div>
        <ol class="help-list" id="help-list"></ol>
        <div class="help-divider"></div>
        <div class="help-data-title">Data tools</div>
        <div class="help-data" id="help-data">
          <button id="data-export-btn">Export palace</button>
          <button id="data-clear-btn" class="danger">Clear palace</button>
        </div>
        <button id="help-close">Got it</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
