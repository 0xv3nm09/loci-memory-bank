<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Loci — spatial memory bank</title>
    <style>
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #loci-hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(10, 14, 28, 0.82);
        border: 1px solid rgba(120, 160, 255, 0.25);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        z-index: 10;
      }
      #loci-hud input {
        width: 320px;
        padding: 9px 12px;
        font-size: 14px;
        color: #eef1ff;
        background: rgba(20, 26, 48, 0.9);
        border: 1px solid rgba(120, 160, 255, 0.3);
        border-radius: 8px;
        outline: none;
      }
      #loci-hud input:focus {
        border-color: rgba(90, 220, 255, 0.7);
      }
      #loci-hud button {
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #06131c;
        background: linear-gradient(180deg, #7ee7d2, #46c9ae);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #loci-hud button.secondary {
        color: #cfe2ff;
        background: rgba(40, 52, 96, 0.9);
        border: 1px solid rgba(120, 160, 255, 0.3);
      }
      #loci-hud button:hover {
        filter: brightness(1.1);
      }
      #loci-hud button#voice-btn.active {
        background: linear-gradient(180deg, #ff8f8f, #d95858);
        color: #fff;
        animation: loci-pulse 1.2s ease-in-out infinite;
      }
      @keyframes loci-pulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
      }
      #hud-status {
        position: fixed;
        left: 50%;
        bottom: 82px;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.04em;
        color: rgba(160, 178, 230, 0.85);
        z-index: 10;
        pointer-events: none;
      }

      #loci-help {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(4, 6, 14, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loci-help .help-card {
        max-width: 480px;
        padding: 26px 30px;
        background: #0e1428;
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 16px;
        color: #dfe6ff;
      }
      #loci-help .help-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      #loci-help .help-list {
        font-size: 14px;
        line-height: 1.65;
        padding-left: 18px;
        color: #c3cdea;
      }
      #loci-help .help-list b {
        color: #eef1ff;
      }
      #loci-help button {
        margin-top: 16px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        color: #06131c;
        background: linear-gradient(180deg, #7ee7d2, #46c9ae);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #loci-help .help-divider {
        margin: 16px 0 10px;
        border-top: 1px solid rgba(140, 170, 255, 0.2);
      }
      #loci-help .help-data-title {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8fa3d8;
        margin-bottom: 8px;
      }
      #loci-help .help-data {
        display: flex;
        gap: 8px;
      }
      #loci-help .help-data button {
        margin-top: 0;
        padding: 8px 12px;
        font-size: 13px;
        color: #c3cdea;
        background: rgba(40, 52, 96, 0.9);
        border: 1px solid rgba(120, 160, 255, 0.3);
      }
      #loci-help .help-data button.danger {
        color: #ffc9c9;
        border-color: rgba(255, 140, 140, 0.4);
      }
      @media (max-width: 640px) {
        #rewind-slider {
          width: 160px;
        }
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>
    <div id="hud-status"></div>
    <div id="loci-hud">
      <input
        id="note-input"
        placeholder="What's on your mind?"
        maxlength="140"
        autocomplete="off"
      />
      <button id="voice-btn" title="Speak a thought">&#127908;</button>
      <button id="add-btn">Add</button>
      <button id="organize-btn" class="secondary">Organize</button>
      <button id="recall-btn" class="secondary">Recall</button>
      <button id="rewind-btn" class="secondary">Rewind</button>
      <button id="demo-btn" class="secondary">Demo dump</button>
      <button id="help-btn" title="How Loci works" class="secondary">?</button>
    </div>
    <div id="loci-help" style="display: none">
      <div class="help-card">
        <div class="help-title">How Loci works</div>
        <ol class="help-list" id="help-list"></ol>
        <div class="help-divider"></div>
        <div class="help-data-title">Desktop data tools</div>
        <div class="help-data">
          <button id="data-export-btn" class="secondary">Export palace JSON</button>
          <button id="data-clear-btn" class="secondary danger">Clear palace</button>
        </div>
        <button id="help-close">Got it</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
