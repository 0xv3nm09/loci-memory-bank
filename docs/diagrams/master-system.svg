f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><text x="421.0" y="309" font-size="11" fill="#7f8ec4" text-anchor="middle">flagged</text><rect x="452" y="268" width="320" height="96" rx="10" fill="#131a30" stroke="#ea4a4a" stroke-width="1.4"/><text x="466" y="290" font-size="10" font-weight="800" fill="#ea4a4a" letter-spacing="1">SAFETY</text><text x="466" y="307" font-size="15.5" font-weight="700" fill="#EDF1FA">3D crisis panel</text><text x="466" y="324" font-size="11.5" fill="#aeb9d9">crisis-panel.ts · world-space · calm tone</text><text x="466" y="339.5" font-size="11.5" fill="#aeb9d9">real resources: 988 · findahelpline.com</text><text x="466" y="355.0" font-size="11.5" fill="#aeb9d9">crisActive blocks organize/recall/capture</text><line x1="220" y1="364" x2="220" y2="389" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><text x="228" y="384.0" font-size="11" fill="#7f8ec4">clear</text><rect x="50" y="396" width="345" height="118" rx="10" fill="#131a30" stroke="#8a93a8" stroke-width="1.4"/><text x="64" y="418" font-size="10" font-weight="800" fill="#8a93a8" letter-spacing="1">PATH A — INSTANT</text><text x="64" y="435" font-size="15.5" font-weight="700" fill="#EDF1FA">Heuristic organizer</text><text x="64" y="452" font-size="11.5" fill="#aeb9d9">clusterer.ts · overlap coefficient + union-find</text><text x="64" y="467.5" font-size="11.5" fill="#aeb9d9">deterministic · zero network · always up</text><text x="64" y="483.0" font-size="11.5" fill="#aeb9d9">result computed before the request is sent</text><rect x="415" y="396" width="345" height="118" rx="10" fill="#131a30" stroke="#e8b34b" stroke-width="1.4"/><text x="429" y="418" font-size="10" font-weight="800" fill="#e8b34b" letter-spacing="1">PATH B — MODEL</text><text x="429" y="435" font-size="15.5" font-weight="700" fill="#EDF1FA">Model client</text><text x="429" y="452" font-size="11.5" fill="#aeb9d9">model-client.ts · schema-bound /api/chat call</text><text x="429" y="467.5" font-size="11.5" fill="#aeb9d9">retry ×1 @1.5s · 30s timeout · warmup @boot</text><text x="429" y="483.0" font-size="11.5" fill="#aeb9d9">sanitize: unknown ids dropped, leftovers swept</text><polyline points="760,440 805,440 805,208 840,208" fill="none" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><text x="808" y="330" font-size="10.5" fill="#7f8ec4" transform="rotate(90 808 330)" text-anchor="middle">POST /chat/completions · JSON schema · GET /api/tags</text><rect x="848" y="150" width="340" height="130" rx="10" fill="#131a30" stroke="#e8b34b" stroke-width="1.4"/><text x="862" y="172" font-size="10" font-weight="800" fill="#e8b34b" letter-spacing="1">SAGE</text><text x="862" y="189" font-size="15.5" font-weight="700" fill="#EDF1FA">Ollama on the GPU box</text><text x="862" y="206" font-size="11.5" fill="#aeb9d9">qwen3:14b · 9.3 GB · pinned in model-client.ts</text><text x="862" y="221.5" font-size="11.5" fill="#aeb9d9">also: gpt-oss:20b · qwen3.5:9b · bge-m3</text><text x="862" y="237.0" font-size="11.5" fill="#aeb9d9">boot warmup: 1-token call, keep_alive 30 min</text><polyline points="1018,280 1060,280 1060,470 760,470" fill="none" stroke="#6f7fb8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="889.0" y="463" font-size="11" fill="#7f8ec4" text-anchor="middle">clusters · edges · suggestions (JSON)</text><rect x="848" y="380" width="340" height="130" rx="10" fill="#131a30" stroke="#e8b34b" stroke-width="1.4"/><text x="862" y="402" font-size="10" font-weight="800" fill="#e8b34b" letter-spacing="1">RESPONSE PIPELINE</text><text x="862" y="419" font-size="15.5" font-weight="700" fill="#EDF1FA">Sanitize + arbitrate</text><text x="862" y="436" font-size="11.5" fill="#aeb9d9">JSON parse or discard · unknown ids dropped</text><text x="862" y="451.5" font-size="11.5" fill="#aeb9d9">coverage &gt;= 60% -&gt; model wins, else local</text><text x="862" y="467.0" font-size="11.5" fill="#aeb9d9">leftover notes -&gt; &#x27;Loose threads&#x27; cluster</text><text x="862" y="482.5" font-size="11.5" fill="#aeb9d9">suggestions capped: 1 expand + 1 challenge</text><line x1="848" y1="470" x2="760" y2="470" stroke="#6f7fb8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="804.0" y="485" font-size="11" fill="#7f8ec4" text-anchor="middle">sanitized result</text><rect x="50" y="540" width="710" height="54" rx="10" fill="#131a30" stroke="#e8b34b" stroke-width="1.4"/><text x="64" y="562" font-size="10" font-weight="800" fill="#e8b34b" letter-spacing="1">ARBITRATION</text><text x="64" y="579" font-size="13.5" font-weight="700" fill="#EDF1FA">≥60% coverage → model wins (orb GOLD) · else local stands (orb GRAY) — the orb records who shaped the layout</text><line x1="220" y1="594" x2="220" y2="623" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="630" width="710" height="96" rx="10" fill="#131a30" stroke="#2fbf9a" stroke-width="1.4"/><text x="64" y="652" font-size="10" font-weight="800" fill="#2fbf9a" letter-spacing="1">THE PAYOFF</text><text x="64" y="669" font-size="15.5" font-weight="700" fill="#EDF1FA">SnapSystem — the snap</text><text x="64" y="686" font-size="11.5" fill="#aeb9d9">flights: eased arcs with particle trails (additive blending)</text><text x="64" y="701.5" font-size="11.5" fill="#aeb9d9">connection lines draw in · synthesized resolving chord</text><text x="64" y="717.0" font-size="11.5" fill="#aeb9d9">canvas type at 1536 px/m · faux-bold · zero font assets</text><line x1="220" y1="726" x2="220" y2="749" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="756" width="710" height="96" rx="10" fill="#131a30" stroke="#5b78e0" stroke-width="1.4"/><text x="64" y="778" font-size="10" font-weight="800" fill="#5b78e0" letter-spacing="1">HUMAN AUTHORITY</text><text x="64" y="795" font-size="15.5" font-weight="700" fill="#EDF1FA">Arrange — cards you own</text><text x="64" y="812" font-size="11.5" fill="#aeb9d9">OneHandGrabbable / pinch · drag on desktop · webcam hands optional</text><text x="64" y="827.5" font-size="11.5" fill="#aeb9d9">userPlaced = true on release → agent never reorganizes them</text><text x="64" y="843.0" font-size="11.5" fill="#aeb9d9">declump: targets relax ≥0.185 m around placements (obstacles, not victims)</text><line x1="220" y1="852" x2="220" y2="875" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="50" y="882" width="710" height="108" rx="10" fill="#131a30" stroke="#5bd9fd" stroke-width="1.4"/><text x="64" y="904" font-size="10" font-weight="800" fill="#5bd9fd" letter-spacing="1">PERSISTENCE</text><text x="64" y="921" font-size="15.5" font-weight="700" fill="#EDF1FA">palace-store.ts — loci.palace.v1</text><text x="64" y="938" font-size="11.5" fill="#aeb9d9">localStorage: notes[] · edges[] · clusterLabels[] · recall{strength,seen}</text><text x="64" y="953.5" font-size="11.5" fill="#aeb9d9">history: ≤30 snapshots {at, notes, edges} — Rewind&#x27;s raw material</text><text x="64" y="969.0" font-size="11.5" fill="#aeb9d9">debounced 600ms/1800ms · beforeunload flush · skipped during scrubs · JSON export</text><line x1="220" y1="990" x2="220" y2="1015" stroke="#6f7fb8" stroke-width="1.8" marker-end="url(#arr)"/><text x="228" y="1010.0" font-size="11" fill="#7f8ec4">next visit</text><rect x="50" y="1022" width="340" height="120" rx="10" fill="#131a30" stroke="#a78bfa" stroke-width="1.4"/><text x="64" y="1044" font-size="10" font-weight="800" fill="#a78bfa" letter-spacing="1">RETURN + RECALL</text><text x="64" y="1061" font-size="15.5" font-weight="700" fill="#EDF1FA">RecallSystem</text><text x="64" y="1078" font-size="11.5" fill="#aeb9d9">greeting: &#x27;last here N ago · N thoughts due&#x27;</text><text x="64" y="1093.5" font-size="11.5" fill="#aeb9d9">quiz: weakest/never-seen first · touch or voice</text><text x="64" y="1109.0" font-size="11.5" fill="#aeb9d9">grading: strength 0–5 · misses resurface first</text><rect x="420" y="1022" width="340" height="120" rx="10" fill="#131a30" stroke="#a78bfa" stroke-width="1.4"/><text x="434" y="1044" font-size="10" font-weight="800" fill="#a78bfa" letter-spacing="1">REWIND</text><text x="434" y="1061" font-size="15.5" font-weight="700" fill="#EDF1FA">Spatial dial</text><text x="434" y="1078" font-size="11.5" fill="#aeb9d9">OneHandGrabbable knob on a track</text><text x="434" y="1093.5" font-size="11.5" fill="#aeb9d9">30 snapshots replay with the snap motion</text><text x="434" y="1109.0" font-size="11.5" fill="#aeb9d9">scrubs never recorded as history</text><rect x="50" y="1180" width="710" height="76" rx="10" fill="#131a30" stroke="#56639a" stroke-width="1.4"/><text x="64" y="1202" font-size="10" font-weight="800" fill="#56639a" letter-spacing="1">LEGEND + MEASURED</text><text x="64" y="1219" font-size="13" font-weight="700" fill="#EDF1FA"></text><text x="64" y="1236" font-size="11.5" fill="#aeb9d9">GOLD orb = model shaped the layout · GRAY = local fallback ran</text><text x="64" y="1251.5" font-size="11.5" fill="#aeb9d9">measured: boot→interactive 1.5s · capture→organize 2.2s · snap &lt;1s local / 6–11s warm · recall 1.1s</text></svg>
