<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1330" viewBox="0 0 1240 1330" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="1240" height="1330" fill="#0b101f"/><text x="40" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Loci — technical architecture</text><text x="40" y="70" font-size="13" fill="#8fa3d8">One client runtime in the headset browser · one external dependency (Sage) behind a tunnel · persistence in the browser</text><rect x="30" y="92" width="760" height="1180" rx="14" fill="#0d1226" stroke="#232c4d"/><text x="48" y="120" font-size="12" font-weight="800" fill="#5b78e0" letter-spacing="1.2">HEADSET BROWSER — IWSDK WEBXR · 100% CLIENT-SIDE · NO DOM IN VR</text><rect x="830" y="92" width="380" height="640" rx="14" fill="#0d1226" stroke="#232c4d"/><text x="848" y="120" font-size="12" font-weight="800" fill="#e8b34b" letter-spacing="1.2">GPU SERVER — VIA CLOUDFLARE TUNNEL</text><rect x="50" y="150" width="172" height="74" rx="10" fill="#131a30" stroke="#5b78e0" stroke-width="1.4"/><text x="64" y="172" font-size="10" font-weight="800" fill="#5b78e0" letter-spacing="1">MIC ORB</text><text x="64" y="189" font-size="13" font-weight="700" fill="#EDF1FA">capture</text><text x="64" y="206" font-size="11.5" fill="#aeb9d9">Web Speech API</text><text x="64" y="221.5" font-size="11.5" fill="#aeb9d9">desktop browsers</text><rect x="234" y="150" width="172" height="74" rx="10" fill="#131a30" stroke="#5b78e0" stroke-width="1.4"/><text x="248" y="172" font-size="10" font-weight="800" fill="#5b78e0" letter-spacing="1">TYPE ORB</text><text x="248" y="189" font-size="13" font-weight="700" fill="#EDF1FA">capture</text><text x="248" y="206" font-size="11.5" fill="#aeb9d9">spatial QWERTY</text><text x="248" y="221.5" font-size="11.5" fill="#aeb9d9">capture-keyboard.ts</