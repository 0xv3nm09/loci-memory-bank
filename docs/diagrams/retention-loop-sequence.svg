<svg xmlns="http://www.w3.org/2000/svg" width="940" height="746" viewBox="0 0 940 746" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="940" height="746" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Reason to Come Back — the loop</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">Two sessions: what is saved, what greets you, what is scheduled.</text><rect width="940" height="746" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Reason to Come Back — the loop</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">Two sessions: what is saved, what greets you, what is scheduled.</text><rect x="154.66666666666669" y="90" width="124" height="36" rx="9" fill="#1b2238" stroke="#5bd9fd"/><text x="216.66666666666669" y="113" font-size="12" font-weight="700" fill="#EDF1FA" text-anchor="middle">You</text><line x1="216.66666666666669" y1="126" x2="216.66666666666669" y2="726" stroke="#3a4b7a" stroke-dasharray="4 5"/><rect x="408.0" y="90" width="124" height="36" rx="9" fill="#1b2238" stroke="#5bd9fd"/><text x="470.0" y="113" font-size="12" font-weight="700" fill="#EDF1FA" text-anchor="middle">Loci</text><line x1="470.0" y1="126" x2="470.0" y2="726" stroke="#3a4b7a" stroke-dasharray="4 5"/><rect x="661.3333333333334" y="90" width="124" height="36" rx="9" fill="#1b2238" stroke="#5bd9fd"/><text x="723.3333333333334" y="113" font-size="12" font-weight="700" fill="#EDF1FA" text-anchor="middle">Palace</text><line x1="723.3333333333334" y1="126" x2="723.3333333333334" y2="726" stroke="#3a4b7a" stroke-dasharray="4 5"/><line x1="50" y1="148" x2="890" y2="148" stroke="#a78bfa" stroke-width="1.4"/><rect x="360.0" y="135" width="220" height="26" rx="13" fill="#10162b" stroke="#a78bfa"/><text x="470.0" y="153" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">SESSION N</text><line x1="216.66666666666669" y1="202" x2="470.0" y2="202" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="343.33333333333337" y="195" font-size="12.5" fill="#c3cdea" text-anchor="middle">dump, organize, arrange</text><line x1="470.0" y1="248" x2="723.3333333333334" y2="248" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="596.6666666666667" y="241" font-size="12.5" fill="#c3cdea" text-anchor="middle">save: layout + strengths + history snapshot</text><line x1="216.66666666666669" y1="294" x2="470.0" y2="294" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="343.33333333333337" y="287" font-size="12.5" fill="#c3cdea" text-anchor="middle">close the app</text><line x1="50" y1="340" x2="890" y2="340" stroke="#a78bfa" stroke-width="1.4"/><rect x="360.0" y="327" width="220" height="26" rx="13" fill="#10162b" stroke="#a78bfa"/><text x="470.0" y="345" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">TIME PASSES</text><line x1="216.66666666666669" y1="394" x2="470.0" y2="394" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="343.33333333333337" y="387" font-size="12.5" fill="#c3cdea" text-anchor="middle">reopen</text><line x1="470.0" y1="440" x2="723.3333333333334" y2="440" stroke="#7f8ec4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="596.6666666666667" y="433" font-size="12.5" fill="#c3cdea" text-anchor="middle">load — restore exactly as left</text><line x1="470.0" y1="486" x2="216.66666666666669" y2="486" stroke="#7f8ec4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="343.33333333333337" y="479" font-size="12.5" font-weight="700" fill="#EDF1FA" text-anchor="middle">welcome back — last here N ago, N due</text><line x1="470.0" y1="532" x2="216.66666666666669" y2="532" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="343.33333333333337" y="525" font-size="12.5" fill="#c3cdea" text-anchor="middle">Recall: weakest / never-seen first</text><text x="343.33333333333337" y="558" font-size="11" font-weight="800" fill="#e8b34b" text-anchor="middle" letter-spacing="1.5">CORRECT</text><line x1="216.66666666666669" y1="578" x2="470.0" y2="578" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="343.33333333333337" y="572" font-size="12.5" fill="#c3cdea" text-anchor="middle">strength +1 → returns less often (green, rising ping)</text><text x="343.33333333333337" y="620" font-size="11" font-weight="800" fill="#e8b34b" text-anchor="middle" letter-spacing="1.5">MISS</text><line x1="216.66666666666669" y1="640" x2="470.0" y2="640" stroke="#7f8ec4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="343.33333333333337" y="634" font-size="12.5" fill="#c3cdea" text-anchor="middle">strength → 0 → resurfaces first (soft tone)</text><line x1="470.0" y1="702" x2="723.3333333333334" y2="702" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="596.6666666666667" y="695" font-size="12.5" fill="#c3cdea" text-anchor="middle">autosave — tomorrow's session is scheduled</text></svg>
