<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1623" viewBox="0 0 940 1623" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="940" height="1623" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Loci — master system map</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">How every piece is connected: headset internals, the model path, and the real-case fallback.</text><rect x="50" y="118" width="560" height="110" rx="14" fill="#1b2238" stroke="#5bd9fd" stroke-width="1.6"/><rect x="66" y="130" width="36" height="20" rx="10" fill="#5bd9fd" opacity="0.18"/><text x="74" y="144" font-size="11.5" font-weight="700" fill="#5bd9fd">IN</text><text x="66" y="168" font-size="16.5" font-weight="700" fill="#EDF1FA">INPUT — capture, four ways</text><text x="66" y="189" font-size="13" fill="#c3cdea">Mic orb (voice, desktop) · Type orb → spatial keyboard</text><text x="66" y="208" font-size="13" fill="#c3cdea">Seed cards (one touch) · typed bar (desktop)</text><line x1="610" y1="173.0" x2="655" y2="173.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="142" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="160" font-size="11.5" font-weight="700" fill="#5bd9fd">WORKS ALONE</text><text x="667" y="178" font-size="11.5" fill="#8fa3d8">every channel is optional</text><text x="667" y="196" font-size="11.5" fill="#8fa3d8">all feed the same pipeline</text><line x1="330.0" y1="230" x2="330.0" y2="276" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="284" width="560" height="110" rx="14" fill="#1b2238" stroke="#ea4a4a" stroke-width="1.6"/><rect x="66" y="296" width="56" height="20" rx="10" fill="#ea4a4a" opacity="0.18"/><text x="74" y="310" font-size="11.5" font-weight="700" fill="#ea4a4a">GATE</text><text x="66" y="334" font-size="16.5" font-weight="700" fill="#EDF1FA">SAFETY — the distress gate</text><text x="66" y="355" font-size="13" fill="#c3cdea">Reviewed trigger list runs on EVERY capture,</text><text x="66" y="374" font-size="13" fill="#c3cdea">before the model ever sees text.</text><line x1="610" y1="339.0" x2="655" y2="339.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="299" width="250" height="80" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="317" font-size="11.5" font-weight="700" fill="#ea4a4a">SAFETY-CRITICAL</text><text x="667" y="335" font-size="11.5" fill="#8fa3d8">flagged → 3D crisis panel,</text><text x="667" y="353" font-size="11.5" fill="#8fa3d8">calm tone, flow stops,</text><text x="667" y="371" font-size="11.5" fill="#8fa3d8">nothing is organized or saved</text><line x1="330.0" y1="396" x2="330.0" y2="442" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><text x="316.0" y="422.0" font-size="12.5" font-weight="700" fill="#ea4a4a" text-anchor="end">flagged</text><text x="344.0" y="422.0" font-size="12.5" font-weight="700" fill="#2fe880">clear</text><rect x="50" y="450" width="268" height="110" rx="14" fill="#1b2238" stroke="#ea4a4a" stroke-width="1.6"/><text x="66" y="476" font-size="16.5" font-weight="700" fill="#EDF1FA">Crisis panel</text><text x="66" y="497" font-size="13" fill="#c3cdea">3D world-space, real resources</text><text x="66" y="516" font-size="13" fill="#c3cdea">I'm okay — continue to resume</text><rect x="342" y="450" width="268" height="91" rx="14" fill="#1b2238" stroke="#2fe880" stroke-width="1.6"/><text x="358" y="476" font-size="16.5" font-weight="700" fill="#EDF1FA">OrganizeSystem</text><text x="358" y="497" font-size="13" fill="#c3cdea">snapshot of layout + notes in context</text><rect x="655" y="460" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="478" font-size="11.5" font-weight="700" fill="#5bd9fd">TWO EXITS ONLY</text><text x="667" y="496" font-size="11.5" fill="#8fa3d8">the gate decides which —</text><text x="667" y="514" font-size="11.5" fill="#8fa3d8">never the model, never a prompt</text><line x1="330.0" y1="562" x2="330.0" y2="608" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="616" width="560" height="110" rx="14" fill="#1b2238" stroke="#e8b34b" stroke-width="1.6"/><rect x="66" y="628" width="116" height="20" rx="10" fill="#e8b34b" opacity="0.18"/><text x="74" y="642" font-size="11.5" font-weight="700" fill="#e8b34b">BOTH PATHS</text><text x="66" y="666" font-size="16.5" font-weight="700" fill="#EDF1FA">ORGANIZE — two intelligences, one contract</text><text x="66" y="687" font-size="13" fill="#c3cdea">Model path: schema-bound call to qwen3-14b (retry once)</text><text x="66" y="706" font-size="13" fill="#c3cdea">Local path: deterministic organizer, instant, always up</text><line x1="610" y1="671.0" x2="655" y2="671.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="640" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="658" font-size="11.5" font-weight="700" fill="#e8b34b">ARBITRATION</text><text x="667" y="676" font-size="11.5" fill="#8fa3d8">model result wins if it covers</text><text x="667" y="694" font-size="11.5" fill="#8fa3d8">≥60% of notes; else local</text><line x1="330.0" y1="728" x2="330.0" y2="774" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="782" width="560" height="110" rx="14" fill="#1b2238" stroke="#e8b34b" stroke-width="1.6"/><text x="66" y="808" font-size="16.5" font-weight="700" fill="#EDF1FA">THE SNAP — the hook</text><text x="66" y="829" font-size="13" fill="#c3cdea">Cards arc into clusters, lines draw in, chord resolves</text><text x="66" y="848" font-size="13" fill="#c3cdea">Organize orb: GOLD = model did it · GRAY = local did</text><line x1="610" y1="837.0" x2="655" y2="837.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="806" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="824" font-size="11.5" font-weight="700" fill="#e8b34b">BEST AGENTIC</text><text x="667" y="842" font-size="11.5" fill="#8fa3d8">the orb is the persistent</text><text x="667" y="860" font-size="11.5" fill="#8fa3d8">who-did-this indicator</text><line x1="330.0" y1="894" x2="330.0" y2="940" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="948" width="560" height="110" rx="14" fill="#1b2238" stroke="#5bd9fd" stroke-width="1.6"/><text x="66" y="974" font-size="16.5" font-weight="700" fill="#EDF1FA">ARRANGE — human authority</text><text x="66" y="995" font-size="13" fill="#c3cdea">Grab / pinch / drag any card anywhere</text><text x="66" y="1014" font-size="13" fill="#c3cdea">userPlaced = true → the agent never moves it again</text><line x1="610" y1="1003.0" x2="655" y2="1003.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="972" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="990" font-size="11.5" font-weight="700" fill="#5bd9fd">CONTROL</text><text x="667" y="1008" font-size="11.5" fill="#8fa3d8">AI proposes; you dispose —</text><text x="667" y="1026" font-size="11.5" fill="#8fa3d8">enforced in code, both paths</text><line x1="330.0" y1="1060" x2="330.0" y2="1106" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="1114" width="560" height="110" rx="14" fill="#1b2238" stroke="#5bd9fd" stroke-width="1.6"/><text x="66" y="1140" font-size="16.5" font-weight="700" fill="#EDF1FA">PERSIST — palace-store</text><text x="66" y="1161" font-size="13" fill="#c3cdea">localStorage: notes, layout, strength, 30 snapshots</text><text x="66" y="1180" font-size="13" fill="#c3cdea">Export to JSON from the ? menu (desktop)</text><line x1="610" y1="1169.0" x2="655" y2="1169.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="1138" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="1156" font-size="11.5" font-weight="700" fill="#5bd9fd">NO SERVER</text><text x="667" y="1174" font-size="11.5" fill="#8fa3d8">the palace lives in the browser —</text><text x="667" y="1192" font-size="11.5" fill="#8fa3d8">privacy by architecture</text><line x1="330.0" y1="1226" x2="330.0" y2="1272" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="1280" width="560" height="110" rx="14" fill="#1b2238" stroke="#a78bfa" stroke-width="1.6"/><text x="66" y="1306" font-size="16.5" font-weight="700" fill="#EDF1FA">RETURN — greeting + Recall</text><text x="66" y="1327" font-size="13" fill="#c3cdea">Welcome back — last here N ago. N thoughts due.</text><text x="66" y="1346" font-size="13" fill="#c3cdea">Quiz: weakest first · graded · strengths reschedule tomorrow</text><line x1="610" y1="1335.0" x2="655" y2="1335.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="1304" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="1322" font-size="11.5" font-weight="700" fill="#a78bfa">LOOP</text><text x="667" y="1340" font-size="11.5" fill="#8fa3d8">strength 0–5 per note,</text><text x="667" y="1358" font-size="11.5" fill="#8fa3d8">misses resurface first</text><line x1="330.0" y1="1392" x2="330.0" y2="1438" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="1446" width="560" height="91" rx="14" fill="#1b2238" stroke="#a78bfa" stroke-width="1.6"/><text x="66" y="1472" font-size="16.5" font-weight="700" fill="#EDF1FA">REWIND — scrub the growth</text><text x="66" y="1493" font-size="13" fill="#c3cdea">Drag the dial: snapshots replay with the snap animation</text><line x1="610" y1="1491.5" x2="655" y2="1491.5" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="1460" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="1478" font-size="11.5" font-weight="700" fill="#a78bfa">ONLY IN VR</text><text x="667" y="1496" font-size="11.5" fill="#8fa3d8">a changelog on a flat screen</text><text x="667" y="1514" font-size="11.5" fill="#8fa3d8">cannot scrub a place</text></svg>
