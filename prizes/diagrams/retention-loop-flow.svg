<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1045" viewBox="0 0 940 1045" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="940" height="1045" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Reason to Come Back — the loop</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">What is saved, what greets you, what is scheduled — across sessions.</text><rect x="50" y="118" width="560" height="110" rx="14" fill="#1b2238" stroke="#a78bfa" stroke-width="1.6"/><rect x="66" y="130" width="56" height="20" rx="10" fill="#a78bfa" opacity="0.18"/><text x="74" y="144" font-size="11.5" font-weight="700" fill="#a78bfa">SAVE</text><text x="66" y="168" font-size="16.5" font-weight="700" fill="#EDF1FA">SESSION N — build the palace</text><text x="66" y="189" font-size="13" fill="#c3cdea">Dump, organize, arrange. Autosave writes notes, layout,</text><text x="66" y="208" font-size="13" fill="#c3cdea">per-note strength (0–5), and a history snapshot.</text><line x1="610" y1="173.0" x2="655" y2="173.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="142" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="160" font-size="11.5" font-weight="700" fill="#a78bfa">PERSISTED</text><text x="667" y="178" font-size="11.5" fill="#8fa3d8">localStorage — survives close,</text><text x="667" y="196" font-size="11.5" fill="#8fa3d8">refresh, and browser restarts</text><line x1="330.0" y1="230" x2="330.0" y2="276" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="284" width="560" height="91" rx="14" fill="#1b2238" stroke="#2fe880" stroke-width="1.6"/><text x="66" y="310" font-size="16.5" font-weight="700" fill="#EDF1FA">TIME PASSES — nothing nags</text><text x="66" y="331" font-size="13" fill="#c3cdea">No streaks, no push, no guilt. The waypoint waits.</text><line x1="610" y1="329.5" x2="655" y2="329.5" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="307" width="250" height="44" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="325" font-size="11.5" font-weight="700" fill="#2fe880">BY DESIGN</text><text x="667" y="343" font-size="11.5" fill="#8fa3d8">missing a day never punishes</text><line x1="330.0" y1="377" x2="330.0" y2="423" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="431" width="560" height="110" rx="14" fill="#1b2238" stroke="#e8b34b" stroke-width="1.6"/><rect x="66" y="443" width="76" height="20" rx="10" fill="#e8b34b" opacity="0.18"/><text x="74" y="457" font-size="11.5" font-weight="700" fill="#e8b34b">RETURN</text><text x="66" y="481" font-size="16.5" font-weight="700" fill="#EDF1FA">SESSION N+1 — the greeting</text><text x="66" y="502" font-size="13" fill="#c3cdea">Restore exactly as left, then:</text><text x="66" y="521" font-size="13" fill="#c3cdea">Welcome back — last here N ago. N thoughts due for Recall.</text><line x1="610" y1="486.0" x2="655" y2="486.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="455" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="473" font-size="11.5" font-weight="700" fill="#e8b34b">THE HOOK</text><text x="667" y="491" font-size="11.5" fill="#8fa3d8">fires at the exact moment</text><text x="667" y="509" font-size="11.5" fill="#8fa3d8">the criteria measure: re-entry</text><line x1="330.0" y1="543" x2="330.0" y2="589" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="597" width="560" height="110" rx="14" fill="#1b2238" stroke="#5bd9fd" stroke-width="1.6"/><text x="66" y="623" font-size="16.5" font-weight="700" fill="#EDF1FA">RECALL — the schedule is the science</text><text x="66" y="644" font-size="13" fill="#c3cdea">Weakest / never-seen notes first. Correct: strength +1,</text><text x="66" y="663" font-size="13" fill="#c3cdea">comes back less often. Miss: strength 0, resurfaces first.</text><line x1="610" y1="652.0" x2="655" y2="652.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="621" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="639" font-size="11.5" font-weight="700" fill="#5bd9fd">SPACED REPETITION</text><text x="667" y="657" font-size="11.5" fill="#8fa3d8">SM-2-lite; thresholds tunable</text><text x="667" y="675" font-size="11.5" fill="#8fa3d8">in palace-store.ts</text><line x1="330.0" y1="709" x2="330.0" y2="755" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="763" width="560" height="91" rx="14" fill="#1b2238" stroke="#a78bfa" stroke-width="1.6"/><text x="66" y="789" font-size="16.5" font-weight="700" fill="#EDF1FA">THE PALACE GREW — and Rewind proves it</text><text x="66" y="810" font-size="13" fill="#c3cdea">Drag the dial: days of growth replay with the snap motion.</text><line x1="610" y1="808.5" x2="655" y2="808.5" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="777" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="795" font-size="11.5" font-weight="700" fill="#a78bfa">VISIBLE GROWTH</text><text x="667" y="813" font-size="11.5" fill="#8fa3d8">'two weeks ago this was three</text><text x="667" y="831" font-size="11.5" fill="#8fa3d8">scattered thoughts'</text><rect x="50" y="910" width="560" height="59" rx="10" fill="#10162b" stroke="#a78bfa" stroke-dasharray="5 4"/><text x="66" y="936" font-size="13" fill="#a78bfa">The loop closes: today's session schedules tomorrow's — longevity by</text><text x="66" y="955" font-size="13" fill="#a78bfa">mechanics, not by notification.</text></svg>
