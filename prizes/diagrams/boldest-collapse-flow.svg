<svg xmlns="http://www.w3.org/2000/svg" width="940" height="610" viewBox="0 0 940 610" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="940" height="610" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Boldest Original Concept — the collapse test</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">Take away VR and the loop falls apart. Take away Loci and nothing fills the gap.</text><rect x="50" y="118" width="560" height="110" rx="14" fill="#1b2238" stroke="#8a93a8" stroke-width="1.6"/><rect x="66" y="130" width="56" height="20" rx="10" fill="#8a93a8" opacity="0.18"/><text x="74" y="144" font-size="11.5" font-weight="700" fill="#8a93a8">THEM</text><text x="66" y="168" font-size="16.5" font-weight="700" fill="#EDF1FA">ON A FLAT SCREEN — what every rival is</text><text x="66" y="189" font-size="13" fill="#c3cdea">A notes app is a list · Anki is a schedule</text><text x="66" y="208" font-size="13" fill="#c3cdea">A mind map is a diagram · A changelog is text</text><line x1="610" y1="173.0" x2="655" y2="173.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="151" width="250" height="44" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="169" font-size="11.5" font-weight="700" fill="#e8b34b">THE CEILING</text><text x="667" y="187" font-size="11.5" fill="#8fa3d8">no presence, no depth, no body</text><line x1="330.0" y1="230" x2="330.0" y2="276" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="284" width="560" height="148" rx="14" fill="#1b2238" stroke="#e8b34b" stroke-width="1.6"/><rect x="66" y="296" width="36" height="20" rx="10" fill="#e8b34b" opacity="0.18"/><text x="74" y="310" font-size="11.5" font-weight="700" fill="#e8b34b">US</text><text x="66" y="334" font-size="16.5" font-weight="700" fill="#EDF1FA">IN VR — what only Loci can be</text><text x="66" y="355" font-size="13" fill="#c3cdea">Thoughts have a PLACE around you</text><text x="66" y="374" font-size="13" fill="#c3cdea">Understanding is physical: grab and move meaning</text><text x="66" y="393" font-size="13" fill="#c3cdea">Memory has a ROOM: the palace persists and grows</text><text x="66" y="412" font-size="13" fill="#c3cdea">History has a DIAL: scrub your own mind's past</text><line x1="610" y1="358.0" x2="655" y2="358.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="318" width="250" height="80" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="336" font-size="11.5" font-weight="700" fill="#e8b34b">THE CLAIM</text><text x="667" y="354" font-size="11.5" fill="#8fa3d8">each step needs presence,</text><text x="667" y="372" font-size="11.5" fill="#8fa3d8">depth, or hands — the three</text><text x="667" y="390" font-size="11.5" fill="#8fa3d8">things monitors cannot give</text><rect x="50" y="488" width="560" height="46" rx="10" fill="#10162b" stroke="#a78bfa" stroke-dasharray="5 4"/><text x="66" y="516" font-size="13" fill="#a78bfa">The 2,000-year-old method of loci always needed an imagined place. VR is the first medium where the place is real.</text></svg>
