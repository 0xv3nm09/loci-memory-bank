<svg xmlns="http://www.w3.org/2000/svg" width="940" height="812" viewBox="0 0 940 812" font-family="Inter, system-ui, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ec4"/></marker></defs><rect width="940" height="812" fill="#0b101f"/><text x="50" y="46" font-size="23" font-weight="800" fill="#EDF1FA">Accessibility — inclusive by default</text><text x="50" y="70" font-size="13.5" fill="#8fa3d8">Four input channels converge on one pipeline; four redundant output signals leave it.</text><rect x="50" y="118" width="560" height="110" rx="14" fill="#1b2238" stroke="#2fe880" stroke-width="1.6"/><rect x="66" y="130" width="116" height="20" rx="10" fill="#2fe880" opacity="0.18"/><text x="74" y="144" font-size="11.5" font-weight="700" fill="#2fe880">4 CHANNELS</text><text x="66" y="168" font-size="16.5" font-weight="700" fill="#EDF1FA">INPUT CHANNELS — each works alone</text><text x="66" y="189" font-size="13" fill="#c3cdea">Voice (mic orb, desktop) · Hands (pinch-grab, touch)</text><text x="66" y="208" font-size="13" fill="#c3cdea">Typed (spatial keyboard, everywhere) · One finger (seed cards)</text><line x1="610" y1="173.0" x2="655" y2="173.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="142" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="160" font-size="11.5" font-weight="700" fill="#2fe880">NO SETUP, NO MODE</text><text x="667" y="178" font-size="11.5" fill="#8fa3d8">any single channel completes</text><text x="667" y="196" font-size="11.5" fill="#8fa3d8">the entire experience</text><line x1="330.0" y1="230" x2="330.0" y2="276" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="284" width="560" height="110" rx="14" fill="#1b2238" stroke="#2fe880" stroke-width="1.6"/><text x="66" y="310" font-size="16.5" font-weight="700" fill="#EDF1FA">ONE PIPELINE</text><text x="66" y="331" font-size="13" fill="#c3cdea">Same distress gate, same organizer, same palace —</text><text x="66" y="350" font-size="13" fill="#c3cdea">the channel you chose changes nothing downstream.</text><line x1="610" y1="339.0" x2="655" y2="339.0" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="308" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="326" font-size="11.5" font-weight="700" fill="#2fe880">EQUAL FIRST-CLASS</text><text x="667" y="344" font-size="11.5" fill="#8fa3d8">typed is never a degraded</text><text x="667" y="362" font-size="11.5" fill="#8fa3d8">fallback (fairness note in docs)</text><line x1="330.0" y1="396" x2="330.0" y2="442" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="450" width="560" height="129" rx="14" fill="#1b2238" stroke="#e8b34b" stroke-width="1.6"/><rect x="66" y="462" width="106" height="20" rx="10" fill="#e8b34b" opacity="0.18"/><text x="74" y="476" font-size="11.5" font-weight="700" fill="#e8b34b">4 SIGNALS</text><text x="66" y="500" font-size="16.5" font-weight="700" fill="#EDF1FA">OUTPUT SIGNALS — every one redundant</text><text x="66" y="521" font-size="13" fill="#c3cdea">Color: CVD-verified palette (worst pair 72)</text><text x="66" y="540" font-size="13" fill="#c3cdea">Glyphs: + and ? marks · Audio: pings and calm tone</text><text x="66" y="559" font-size="13" fill="#c3cdea">Scale: Aa orb, 100–150% live</text><line x1="610" y1="514.5" x2="655" y2="514.5" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="483" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="501" font-size="11.5" font-weight="700" fill="#e8b34b">VERIFICATION</text><text x="667" y="519" font-size="11.5" fill="#8fa3d8">Viénot simulation over deutan,</text><text x="667" y="537" font-size="11.5" fill="#8fa3d8">protan, tritan — see palette.ts</text><line x1="330.0" y1="581" x2="330.0" y2="627" stroke="#7f8ec4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="635" width="560" height="91" rx="14" fill="#1b2238" stroke="#ea4a4a" stroke-width="1.6"/><text x="66" y="661" font-size="16.5" font-weight="700" fill="#EDF1FA">CRISIS SURFACE — reaches everyone</text><text x="66" y="682" font-size="13" fill="#c3cdea">3D panel + calm audio cue: safety not depending on vision.</text><line x1="610" y1="680.5" x2="655" y2="680.5" stroke="#3a4b7a" stroke-dasharray="3 4"/><rect x="655" y="649" width="250" height="62" rx="10" fill="#10162b" stroke="#3a4b7a" stroke-dasharray="4 4"/><text x="667" y="667" font-size="11.5" font-weight="700" fill="#ea4a4a">SAFETY</text><text x="667" y="685" font-size="11.5" fill="#8fa3d8">the one moment that must</text><text x="667" y="703" font-size="11.5" fill="#8fa3d8">land for every user</text></svg>
